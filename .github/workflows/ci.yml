name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tool
        run: python -m pip install cmake==4.4.4
      - name: Check clean checkout requires explicit bootstrap
        shell: bash
        run: |
          python - <<'PYTHON'
          import subprocess
          tracked = subprocess.check_output(['git', 'ls-files', 'third_party/libsvm'], text=True)
          assert not tracked, tracked
          for path in ('third_party/libsvm/svm.cpp',
                       'third_party/.libsvm-fetch-interrupted/svm.cpp'):
              subprocess.run(['git', 'check-ignore', '--no-index', path], check=True)
          result = subprocess.run(
              ['cmake', '-S', '.', '-B', 'build/missing-dependency', '-DBUILD_TESTING=OFF'],
              capture_output=True, text=True, check=False,
          )
          assert result.returncode != 0, result.stdout
          assert 'scripts/fetch_libsvm.py' in result.stderr, result.stderr
          PYTHON
      - name: Fetch and verify pinned LIBSVM sources
        run: python scripts/fetch_libsvm.py
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test numerical, CLI, dependency, and installation contracts
        run: ctest --preset dev
      - name: Run the documented Windows batch workflow
        if: runner.os == 'Windows'
        run: ./sample.bat build\dev\Debug
      - name: Configure production without Python or dependency fetching
        run: >-
          cmake -S . -B build/production -DBUILD_TESTING=OFF
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build production
        run: cmake --build build/production --config Release

  sanitizers:
    name: Address and undefined-behavior sanitizers
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.4.4
      - run: python scripts/fetch_libsvm.py
      - run: cmake --preset sanitizers
      - run: cmake --build --preset sanitizers
      - run: ctest --preset sanitizers

  formatting:
    name: Project C++ formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==19.1.7
      - name: Check project sources, excluding unchanged historical analyzer
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          files = sorted(
              path for pattern in ('*.h', '*.cpp', 'tests/*.cpp')
              for path in Path('.').glob(pattern)
          )
          subprocess.run(['clang-format', '--dry-run', '--Werror', *map(str, files)], check=True)
          PY

  coverage:
    name: Project coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.4.4 gcovr==8.3
      - run: python scripts/fetch_libsvm.py
      - run: cmake --preset coverage
      - run: cmake --build --preset coverage
      - run: ctest --preset coverage
      - name: Enforce coverage for project implementation
        run: |
          python -c "from pathlib import Path; Path('coverage').mkdir(exist_ok=True)"
          gcovr --root . --filter '(StringKernels|Dataset|LibsvmWriter|CliOptions|StringKernelConverter)\.cpp$' --print-summary --fail-under-line 98 --html-details coverage/index.html --xml coverage/coverage.xml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: project-coverage
          path: coverage/
