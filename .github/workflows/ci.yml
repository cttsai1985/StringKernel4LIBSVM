name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tool
        run: python -m pip install cmake==3.31.6
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test numerical, CLI, dependency, and installation contracts
        run: ctest --preset dev
      - name: Configure production without Python or dependency fetching
        run: >-
          cmake -S . -B build/production -DBUILD_TESTING=OFF
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build production
        run: cmake --build build/production --config Release

  sanitizers:
    name: Address and undefined-behavior sanitizers
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6
      - run: cmake --preset sanitizers
      - run: cmake --build --preset sanitizers
      - run: ctest --preset sanitizers

  formatting:
    name: Project C++ formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==19.1.7
      - name: Check project sources, excluding unchanged historical analyzer
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          files = sorted(
              path for pattern in ('*.h', '*.cpp', 'tests/*.cpp')
              for path in Path('.').glob(pattern)
              if path.name != 'svmsk_analyser.cpp'
          )
          subprocess.run(['clang-format', '--dry-run', '--Werror', *map(str, files)], check=True)
          PY

  coverage:
    name: Project coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6 gcovr==8.3
      - run: cmake --preset coverage
      - run: cmake --build --preset coverage
      - run: ctest --preset coverage
      - name: Enforce coverage for project implementation
        run: |
          python -c "from pathlib import Path; Path('coverage').mkdir(exist_ok=True)"
          gcovr --root . --filter '(StringKernels|Dataset|LibsvmWriter|GetLongOpt|StringKernelConverter)\.cpp$' --print-summary --fail-under-line 85 --html-details coverage/index.html --xml coverage/coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-coverage
          path: coverage/
